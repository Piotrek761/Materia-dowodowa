<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Materia Dowodowa - Generator Orzeczeń Sądowych</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Bad+Script&family=Caveat:wght@600&family=Dancing+Script:wght@700&family=Great+Vibes&family=Marck+Script&family=Meie+Script&family=Parisienne&family=Pinyon+Script&family=Sacramento&family=Tangerine:wght@700&family=Zeyada&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #070913;
            --panel-bg: #0c1222;
            --panel-card: #121c38;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #d4af37;
            --accent-hover: #b89728;
            --btn-blue: #1b365d;
            --btn-blue-hover: #142846;
            --border: #1e3060;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            display: flex;
            gap: 25px;
            max-width: 1700px;
            width: 100%;
        }

        .control-panel {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            flex: 1.2;
            min-width: 620px;
            box-sizing: border-box;
            max-height: 94vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .document-preview {
            background: #ffffff;
            color: #000;
            padding: 50px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            flex: 1;
            min-width: 600px;
            max-width: 800px;
            box-sizing: border-box;
            max-height: 94vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .game-logo {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        h2 {
            font-size: 18px;
            color: var(--text-main);
            margin: 0;
        }

        .section-box {
            background: var(--panel-card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .section-box h3 {
            font-size: 13px;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
            flex: 1;
        }

        label {
            display: block;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: inherit;
            background-color: #080d1a;
            color: #fff;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #101932;
        }

        textarea.editor-box {
            height: 220px;
            resize: vertical;
            line-height: 1.5;
        }

        button {
            padding: 11px 15px;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--btn-blue-hover);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-export {
            background-color: var(--accent);
            color: #000;
            flex: 1;
        }
        .btn-export:hover {
            background-color: var(--accent-hover);
            color: #000;
        }

        .btn-pdf {
            background-color: #8b1e1e;
            flex: 1;
        }
        .btn-pdf:hover {
            background-color: #6c1717;
        }

        .btn-json {
            background-color: var(--btn-blue);
            flex: 1;
        }
        .btn-json:hover {
            background-color: var(--btn-blue-hover);
        }

        .file-upload-label {
            background: #121c38;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            display: block;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            border: 1px dashed var(--border);
            transition: background 0.2s;
        }
        .file-upload-label:hover {
            background: #1b2850;
        }

        .doc-page {
            font-size: 13.5px;
            color: #000;
            font-family: 'Times New Roman', Times, serif;
        }

        .header-left {
            float: left;
            width: 55%;
            font-size: 0.95em;
            line-height: 1.4;
            font-weight: bold;
            text-transform: uppercase;
        }

        .header-right {
            float: right;
            width: 40%;
            text-align: right;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .clearfix {
            clear: both;
        }

        .court-composition {
            text-align: center;
            margin: 25px 0;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .case-header-block {
            text-align: justify;
            margin-bottom: 20px;
            font-size: 0.95em;
            line-height: 1.4;
            text-indent: 20px;
        }

        .doc-title-section {
            text-align: center;
            margin: 25px 0 20px 0;
        }

        .doc-main-title {
            font-size: 1.25em;
            font-weight: bold;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .doc-content-body {
            font-size: 0.95em;
            line-height: 1.5;
            text-align: justify;
            white-space: pre-wrap;
            text-indent: 20px;
        }

        .signature-section-wrapper {
            margin-top: 45px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .seal-container {
            width: 45%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signature-block-right {
            width: 50%;
            text-align: center;
        }

        .handwritten-signature {
            font-size: 32px;
            margin-bottom: -10px;
            min-height: 40px;
            color: #1b365d;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .control-panel, .btn-row, .file-upload-label {
                display: none !important;
            }
            .document-preview {
                box-shadow: none;
                max-height: none;
                width: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- PANEL STEROWANIA -->
        <div class="control-panel">
            <div class="panel-header">
                <svg class="game-logo" version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254.000000 1254.000000" preserveAspectRatio="xMidYMid meet">

                <h2>Materia Dowodowa – Generator Orzeczeń Sądowych</h2>
            </div>

            <div class="section-box">
                <h3>1. Sąd i Sygnatura</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="courtNameInput">Nazwa Sądu:</label>
                        <input type="text" id="courtNameInput" value="Sąd Rejonowy w Gryfowie Wlkp." oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="divisionInput">Wydział:</label>
                        <input type="text" id="divisionInput" value="V Wydział Gospodarczy" oninput="updateDocument()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cityDateInput">Miejscowość i data:</label>
                        <input type="text" id="cityDateInput" value="Gryfów Wlkp., dnia 3 sierpnia 2026 r." oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="ldzInput">Sygnatura akt:</label>
                        <input type="text" id="ldzInput" value="V GC 412/26" oninput="updateDocument()">
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h3>2. Skład Sądu i Protokolant</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="judgeInput">Przewodniczący / Sędzia Referent:</label>
                        <input type="text" id="judgeInput" value="Sędzia SR Jan Zaleski" oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="clerkInput">Protokolant:</label>
                        <input type="text" id="clerkInput" value="staż. Anna Nowak" oninput="updateDocument()">
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h3>3. Strony i Przedmiot Sprawy</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="plaintiffInput">Powód:</label>
                        <input type="text" id="plaintiffInput" value="Nieznanowscy Sp. z o.o." oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="defendantInput">Pozwany:</label>
                        <input type="text" id="defendantInput" value="Firma [Dane spółki pozwanej]" oninput="updateDocument()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="hearingTypeInput">Tryb rozpoznania / Posiedzenie:</label>
                        <input type="text" id="hearingTypeInput" value="na posiedzeniu niejawnym w sprawie gospodarczej" oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="subjectInput">Przedmiot sprawy (o...):</label>
                        <input type="text" id="subjectInput" value="o zapłatę i zabezpieczenie" oninput="updateDocument()">
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h3>4. Tytuł Orzeczenia</h3>
                <div class="form-group">
                    <label for="titleInput">Rodzaj orzeczenia:</label>
                    <input type="text" id="titleInput" value="POSTANOWIENIE" oninput="updateDocument()">
                </div>
            </div>

            <div class="section-box">
                <h3>5. Sentencja i Uzasadnienie</h3>
                <div class="form-group">
                    <label for="contentEditor">Treść sentencji oraz uzasadnienia:</label>
                    <textarea id="contentEditor" class="editor-box" oninput="updateDocument()">postanawia:
1. oddalić wniosek powoda o zabezpieczenie powództwa poprzez zajęcie rachunków bankowych dłużnika;
2. zasądzić od powoda na rzecz pozwanego kwotę 900 zł (słownie: dziewięćset złotych 00/100) tytułem zwrotu kosztów zastępstwa procesowego.

UZASADNIENIE

Wniosek o zabezpieczenie, wniesiony w pismu procesowym z dnia 15 lipca 2026 r., nie zasługuje na uwzględnienie. Zgodnie z art. 730[1] § 1 k.p.c., udzielenia zabezpieczenia może żądać każda strona, jeżeli uprawdopodobni roszczenie oraz interes prawny w udzieleniu zabezpieczenia. W realiach niniejszej sprawy strona powoda sprostała obowiązkowi uprawdopodobnienia samego roszczenia, jednakże nie wykazała przesłanki interesu prawnego.

Samo twierdzenie o trudnej sytuacji finansowej pozwanego, niepoparte konkretnymi dowodami na trwałą niewypłacalność czy celowe wyzbywanie się majątku, nie stanowi wystarczającej podstawy do przyjęcia, że brak zabezpieczenia uniemożliwi lub poważnie utrudni wykonanie zapadłego w sprawie orzeczenia.

Mając powyższe na uwadze, na podstawie powołanych przepisów oraz art. 355 § 1 k.p.c. w zw. z art. 13 § 2 k.p.c., Sąd orzekł jak w sentencji postanowienia.</textarea>
                </div>
            </div>

            <div class="section-box">
                <h3>6. Konfiguracja Pieczęti Sądowej</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sealUpperText">Tekst górny pieczęti:</label>
                        <input type="text" id="sealUpperText" value="SĄD REJONOWY" oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="sealLowerText">Tekst dolny pieczęti (Miejscowość):</label>
                        <input type="text" id="sealLowerText" value="W GRYFOWIE WLKP." oninput="updateDocument()">
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h3>7. Podpis Sędziego (Styl i Zarządzanie)</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="lawyerInput">Sędzia (Podpis - tekst/imię):</label>
                        <input type="text" id="lawyerInput" value="Sędzia SR Jan Zaleski" oninput="updateDocument()">
                    </div>
                    <div class="form-group">
                        <label for="lawyerDescInput">Opis pod podpisem:</label>
                        <input type="text" id="lawyerDescInput" value="Przewodniczący / Sędzia Referent" oninput="updateDocument()">
                    </div>
                </div>
                <div class="form-row">
                    <button type="button" onclick="generateSignature()" style="flex:1;">Losuj nowy styl</button>
                    <button type="button" onclick="saveSignaturePresetJSON()" style="flex:1; background-color: #2e7d32;">Zapisz styl (JSON)</button>
                </div>
                <div>
                    <label for="importSigFile" class="file-upload-label" style="margin-top: 5px;">Wczytaj zapisany styl podpisu (JSON)</label>
                    <input type="file" id="importSigFile" accept=".json" style="display: none;" onchange="loadSignaturePresetJSON(event)">
                </div>
            </div>

            <div class="section-box">
                <h3>8. Nazwa pliku do pobrania</h3>
                <div class="form-group">
                    <label for="filenameInput">Własna nazwa pliku (bez rozszerzenia):</label>
                    <input type="text" id="filenameInput" value="postanowienie_sadowe">
                </div>
            </div>

            <div class="btn-row">
                <button type="button" class="btn-export" onclick="exportHTML()">Pobierz HTML (A4)</button>
                <button type="button" class="btn-pdf" onclick="exportPDF()">Eksport do PDF (A4)</button>
                <button type="button" class="btn-json" onclick="saveJSON()">Zapisz JSON</button>
            </div>
            <div>
                <label for="importFile" class="file-upload-label">Wczytaj konfigurację z pliku JSON</label>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importJSON(event)">
            </div>
        </div>

        <!-- PODGLĄD DOKUMENTU NA ŻYWO -->
        <div class="document-preview" id="previewArea">
            <div class="doc-page">
                <div style="width: 100%; margin-bottom: 30px;">
                    <div class="header-left" id="displayCourtHeader"></div>
                    <div class="header-right">
                        Sygn. akt <strong id="displayLdz"></strong><br>

                    </div>

                <div class="case-header-block" id="displayCaseHeader"></div>

                <div class="doc-content-body" id="displayContent"></div>

                    <div class="signature-block-right">
                        <div id="displaySignature" class="handwritten-signature"></div>
                        <div style="font-size: 0.95em; border-top: 1px solid #000; padding-top: 5px; margin-top: 5px;" id="displayLawyerDesc"></div>

    <script>
        const signatureFonts = [
            'Alex Brush', 'Allura', 'Bad Script', 'Caveat',
            'Dancing Script', 'Great Vibes', 'Marck Script',
            'Meie Script', 'Parisienne', 'Pinyon Script',
            'Sacramento', 'Tangerine', 'Zeyada'
        ];

        let currentFont = 'Dancing Script';

        function generateSignature() {
            const randomFont = signatureFonts[Math.floor(Math.random() * signatureFonts.length)];
            currentFont = randomFont;
            updateDocument();
        }

        function updateDocument() {
            const court = document.getElementById('courtNameInput').value;
            const division = document.getElementById('divisionInput').value;
            document.getElementById('displayCourtHeader').innerHTML = `${court}<br>${division}`;

            document.getElementById('displayCityDate').innerText = document.getElementById('cityDateInput').value;
            document.getElementById('displayLdz').innerText = document.getElementById('ldzInput').value;
            document.getElementById('displayTitle').innerText = document.getElementById('titleInput').value;

            const judge = document.getElementById('judgeInput').value;
            const clerk = document.getElementById('clerkInput').value;
            document.getElementById('displayCourtComposition').innerText = `Przewodniczący: ${judge}
Protokolant: ${clerk}`;

            const plaintiff = document.getElementById('plaintiffInput').value;
            const defendant = document.getElementById('defendantInput').value;
            const hearingType = document.getElementById('hearingTypeInput').value;
            const subject = document.getElementById('subjectInput').value;

            document.getElementById('displayCaseHeader').innerText =
                `Sąd Rejonowy w sentencji ${hearingType} w sprawie z powództwa ${plaintiff} przeciwko ${defendant} ${subject}:`;

            document.getElementById('displayContent').innerText = document.getElementById('contentEditor').value;

            document.getElementById('displaySealUpper').textContent = document.getElementById('sealUpperText').value;
            document.getElementById('displaySealLower').textContent = document.getElementById('sealLowerText').value;

            const lawyerText = document.getElementById('lawyerInput').value;
            const sigContainer = document.getElementById('displaySignature');
            sigContainer.style.fontFamily = `'${currentFont}', cursive`;
            sigContainer.innerText = lawyerText;

            document.getElementById('displayLawyerDesc').innerText = document.getElementById('lawyerDescInput').value;
        }

        function saveSignaturePresetJSON() {
            const lawyerText = document.getElementById('lawyerInput').value;
            const data = {
                type: "signature_preset",
                text: lawyerText,
                font: currentFont,
                desc: document.getElementById('lawyerDescInput').value
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'styl_podpisu.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadSignaturePresetJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.text && data.font) {
                        document.getElementById('lawyerInput').value = data.text;
                        currentFont = data.font;
                        if (data.desc) document.getElementById('lawyerDescInput').value = data.desc;
                        updateDocument();
                        alert('Styl podpisu wczytany z pliku JSON pomyślnie!');
                    } else {
                        alert('Błąd: Wybrany plik JSON nie zawiera prawidłowych danych stylu podpisu.');
                    }
                } catch (err) {
                    alert('Błąd podczas parsowania pliku JSON.');
                }
            };
            reader.readAsText(file);
        }

        function exportHTML() {
            const filename = document.getElementById('filenameInput').value || 'dokument';
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportPDF() {
            window.print();
        }

        function saveJSON() {
            const filename = document.getElementById('filenameInput').value || 'konfiguracja';
            const data = {
                type: "full_document_configuration",
                courtName: document.getElementById('courtNameInput').value,
                division: document.getElementById('divisionInput').value,
                cityDate: document.getElementById('cityDateInput').value,
                ldz: document.getElementById('ldzInput').value,
                judge: document.getElementById('judgeInput').value,
                clerk: document.getElementById('clerkInput').value,
                plaintiff: document.getElementById('plaintiffInput').value,
                defendant: document.getElementById('defendantInput').value,
                hearingType: document.getElementById('hearingTypeInput').value,
                subject: document.getElementById('subjectInput').value,
                title: document.getElementById('titleInput').value,
                content: document.getElementById('contentEditor').value,
                sealUpper: document.getElementById('sealUpperText').value,
                sealLower: document.getElementById('sealLowerText').value,
                lawyer: document.getElementById('lawyerInput').value,
                lawyerDesc: document.getElementById('lawyerDescInput').value,
                signatureFont: currentFont
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.courtName) document.getElementById('courtNameInput').value = data.courtName;
                    if (data.division) document.getElementById('divisionInput').value = data.division;
                    if (data.cityDate) document.getElementById('cityDateInput').value = data.cityDate;
                    if (data.ldz) document.getElementById('ldzInput').value = data.ldz;
                    if (data.judge) document.getElementById('judgeInput').value = data.judge;
                    if (data.clerk) document.getElementById('clerkInput').value = data.clerk;
                    if (data.plaintiff) document.getElementById('plaintiffInput').value = data.plaintiff;
                    if (data.defendant) document.getElementById('defendantInput').value = data.defendant;
                    if (data.hearingType) document.getElementById('hearingTypeInput -> value') || (document.getElementById('hearingTypeInput').value = data.hearingType);
                    if (data.subject) document.getElementById('subjectInput').value = data.subject;
                    if (data.title) document.getElementById('titleInput').value = data.title;
                    if (data.content) document.getElementById('contentEditor').value = data.content;
                    if (data.sealUpper) document.getElementById('sealUpperText').value = data.sealUpper;
                    if (data.sealLower) document.getElementById('sealLowerText').value = data.sealLower;
                    if (data.lawyer) document.getElementById('lawyerInput').value = data.lawyer;
                    if (data.lawyerDesc) document.getElementById('lawyerDescInput').value = data.lawyerDesc;
                    if (data.signatureFont) currentFont = data.signatureFont;
                    updateDocument();
                    alert('Konfiguracja z pliku JSON wczytana pomyślnie!');
                } catch (err) {
                    alert('Błąd podczas parsowania pliku JSON.');
                }
            };
            reader.readAsText(file);
        }

        window.onload = updateDocument;
    </script>
